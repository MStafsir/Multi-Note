# ============================================================
# Branch Protection Rules Configuration
# GitHub repository settings for branch protection
# These rules are enforced via the CI pipeline above
# ============================================================
#
# To apply these settings, configure in GitHub repository settings:
# Settings → Branches → Branch protection rules → Add rule for "main"
#
# Required settings:
#
# 1. Branch name pattern: main
#
# 2. Protect matching branches:
#    - Require a pull request before merging
#    - Require approvals: 1 (for team repos)
#    - Dismiss stale pull request approvals when new commits are pushed
#    - Require review from Code Owners (if CODEOWNERS file exists)
#
# 3. Require status checks to pass before merging:
#    - Lint
#    - Type Check
#    - Unit Tests
#    - Integration Tests
#    - Build
#    - E2E Tests
#    - Require branches to be up to date before merging
#
# 4. Require conversation resolution before merging
#
# 5. Do NOT allow:
#    - Force pushes
#    - Deletions
#
# 6. Restrictions (optional):
#    - Restrict who can push to matching branches
#
# Apply similar rules for "develop" branch (relaxed):
#    - Require status checks: Lint, Type Check, Unit Tests
#    - Allow force pushes by admins only
#
# ============================================================
